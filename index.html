<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sports Day English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;600;700&family=Lilita+One&display=swap">
<style>
/* Kid-first layout: big PLAY button, icons over words, picture + question side by side (stacked on phones) */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E6F0FA; --ink:#17254A; --muted:#55668A; --navy:#14306E; --navy-2:#0C1F4D;
  --orange:#F26A1B; --orange-d:#B9490A; --grass:#2E9A4E; --grass-d:#1C6E35;
  --card:#FFFFFF; --line:#C6D6EC; --led:#FFB627; --soft:#F2F7FD;
  --pc:#E0262B; --mem:#D02BC0; --prep:#FFE24A; --good:#178F4B; --warn:#D07A00; --bad:#D23A3A;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-led:'Bungee','Arial Black',Impact,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
#app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}

/* scoreboard */
.board{background:var(--navy);color:#fff;border-radius:20px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 5px 0 var(--navy-2)}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;background:none;border:0;padding:2px 0;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1;white-space:nowrap}
.chips{display:flex;gap:8px}
.chip{background:var(--navy-2);border-radius:999px;padding:5px 12px 5px 8px;display:flex;align-items:center;gap:6px}
.chip .emo{font-size:1.25rem}
.chip strong{font-family:var(--f-led);color:var(--led);font-size:1.15rem;font-weight:400;font-variant-numeric:tabular-nums;display:inline-block}
.chip strong.pop{animation:pop .6s ease}
.chip.fire{background:#7A2410}
@keyframes pop{30%{transform:scale(1.4);color:#fff}}

.card{background:var(--card);border-radius:22px;border:2px solid var(--line)}
.btn{border:0;border-radius:16px;padding:12px 20px;font-weight:700;font-size:1.05rem;background:var(--soft);color:var(--ink);
  box-shadow:0 4px 0 var(--line);transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
.btn-primary:active{box-shadow:0 1px 0 var(--orange-d)}
.btn-green{background:var(--grass);color:#fff;box-shadow:0 4px 0 var(--grass-d)}
.btn-green:active{box-shadow:0 1px 0 var(--grass-d)}
.btn-ic{width:56px;padding:0;font-size:1.6rem}
.btn-sm{padding:7px 12px;font-size:.85rem;border-radius:10px;min-height:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;padding:16px;align-items:center}
.hero-pic{position:relative;border:0;padding:0;background:none;border-radius:16px;overflow:hidden;display:block}
.hero-pic svg{display:block;width:100%;height:auto}
.hero-pic .tag{position:absolute;left:10px;top:10px;background:rgba(20,48,110,.88);color:#fff;font-family:var(--f-display);font-size:1.1rem;padding:4px 12px;border-radius:999px}
.hero-side{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:4px solid var(--line);background:var(--soft);border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s}
.mode .emo{font-size:2.6rem}
.mode b{font-family:var(--f-display);font-weight:400;font-size:1.4rem;line-height:1}
.mode[aria-pressed="true"]{border-color:var(--orange);background:#FFF1E8;transform:scale(1.04)}
.play{border:0;border-radius:24px;background:var(--grass);color:#fff;box-shadow:0 7px 0 var(--grass-d);font-family:var(--f-display);font-size:clamp(2.2rem,6vw,3rem);
  padding:14px 10px;display:flex;align-items:center;justify-content:center;gap:12px;animation:breathe 1.8s ease-in-out infinite}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 var(--grass-d)}
.play svg{width:.9em;height:.9em}
@keyframes breathe{50%{transform:scale(1.05)}}
.gift{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:10px 12px;border:0;text-align:left}
.gift .emo{font-size:2rem}
.gift .meter{flex:1}
.gift b{font-family:var(--f-led);font-weight:400;color:var(--orange);font-size:1rem;white-space:nowrap}
.meter{height:16px;border-radius:99px;background:#fff;border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--led),var(--orange));border-radius:99px;transition:width .6s}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.place{padding:0;overflow:hidden;display:flex;flex-direction:column;border:3px solid var(--line);background:var(--card);border-radius:18px;transition:transform .12s;position:relative}
.place:hover{transform:translateY(-3px);border-color:var(--orange)}
.place.next{border-color:var(--grass)}
.place.next::after{content:"▶";position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--grass);color:#fff;display:grid;place-items:center;font-size:.9rem;animation:breathe 1.4s infinite}
.place svg{display:block;width:100%;height:auto}
.place .stars{padding:4px 0 6px;justify-content:center;width:100%;font-size:1.35rem}
.stars{display:inline-flex;gap:1px;color:var(--led);letter-spacing:1px;white-space:nowrap}
.stars .off{color:#D4DCE8}
.foot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.parents{padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.parents h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem}
.note{font-size:.85rem;color:var(--muted);margin:0}

/* game */
.game{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.pic{padding:10px;display:flex;flex-direction:column;gap:8px;position:relative}
.pic svg{display:block;width:100%;height:auto;border-radius:14px}
.pic .lbl{position:absolute;right:18px;top:18px;min-height:44px;width:auto;padding:0 12px;font-size:1.3rem;background:rgba(255,255,255,.92)}
.ring{fill:none;stroke:var(--orange);stroke-width:4;stroke-dasharray:10 7;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-34}}
.qpanel{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qpanel.shake{animation:shake .35s}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.track{display:flex;gap:6px;align-items:center}
.track i{width:26px;height:26px;border-radius:50%;background:var(--soft);border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.9rem}
.track i.done{background:var(--grass);border-color:var(--grass);color:#fff}
.track i.miss{background:var(--led);border-color:var(--led);color:#fff}
.track i.now{border-color:var(--orange);transform:scale(1.2)}
.prompt{font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,3.6vw,2.2rem);line-height:1.15;margin:0;text-wrap:balance}
.speak-btn{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--led);box-shadow:0 4px 0 #C98A10;display:grid;place-items:center;font-size:1.6rem}
.speak-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C98A10}
.ans{width:100%;font:inherit;font-size:1.6rem;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);letter-spacing:.04em}
.ans:focus{border-color:var(--orange);outline:none}
textarea.ans{min-height:96px;resize:vertical;font-size:1.25rem;letter-spacing:0}
.big-icon{display:grid;place-items:center;background:var(--soft);border-radius:18px;padding:10px}
.big-icon svg{width:140px;height:140px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{background:var(--soft);border:4px solid var(--line);border-radius:18px;padding:8px;display:grid;place-items:center;transition:transform .1s}
.choice:active{transform:scale(.95)}
.choice svg{width:100%;max-width:120px;height:auto;aspect-ratio:1}
.choice.right{border-color:var(--good);background:#E3F6EA;animation:bounce .5s}
.choice.wrong{border-color:var(--bad);background:#FCE6E6;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bounce{40%{transform:scale(1.12)}}
.blanks{font-size:1.4rem;line-height:2.5}
.blank{font:inherit;font-size:1.3rem;width:8em;max-width:100%;padding:2px 8px;border:0;border-bottom:4px solid var(--ink);background:var(--soft);border-radius:8px 8px 0 0;color:var(--ink)}
.blank.ok{border-color:var(--good);background:#E3F6EA}
.blank.bad{border-color:var(--bad);background:#FCE6E6}
.preview{min-height:2.2em;font-size:1.2rem;padding:8px 10px;border-radius:12px;background:var(--soft)}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:6px;align-items:center;border-radius:999px;padding:4px 10px 4px 6px;background:var(--soft);font-weight:700;font-size:.95rem;opacity:.55;transition:opacity .2s, transform .2s}
.checks li::before{content:"";width:18px;height:18px;border-radius:50%;border:3px solid var(--line);flex:none}
.checks li.on{opacity:1;transform:scale(1.05)}
.checks li.on::before{background:var(--good);border-color:var(--good)}
.checks label{display:flex;gap:6px;align-items:center}
.voice{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:var(--orange);box-shadow:0 7px 0 var(--orange-d);display:grid;place-items:center;animation:breathe 1.8s ease-in-out infinite}
.mic svg{width:54px;height:54px}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(210,58,58,.55),0 7px 0 #8f2222}100%{box-shadow:0 0 0 28px rgba(210,58,58,0),0 7px 0 #8f2222}}
.heard{text-align:center;color:var(--muted);min-height:1.5em;font-size:1.1rem}
.heard q{color:var(--ink);font-weight:600}
.saybox{background:var(--soft);border-radius:18px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.saybox .say-big{font-family:var(--f-display);font-size:1.7rem;margin:0}
.adult{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.adult .btn{font-size:1.8rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.fb{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.fb.great{background:#E3F6EA}
.fb.almost{background:#FFF3D6}
.fb.try{background:#FCE9E9}
.fb .verdict{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.9rem;line-height:1}
.fb .verdict .emo{font-size:2.6rem;animation:bounce .6s}
.fb.great .verdict{color:var(--good)} .fb.almost .verdict{color:var(--warn)} .fb.try .verdict{color:var(--bad)}
.fb .msg{font-size:1.05rem}
.fb .model{font-size:1.3rem;line-height:1.9;background:#fff;border-radius:12px;padding:6px 12px}
.pts{font-family:var(--f-led);font-size:1.2rem;color:var(--orange)}
.combo{font-family:var(--f-led);font-size:1rem;color:#fff;background:#D9480F;border-radius:999px;padding:3px 10px;animation:bounce .6s}
.next{position:relative;overflow:hidden;min-width:140px;font-size:1.6rem}
.next .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.3);width:0;animation:fill linear forwards}
@keyframes fill{to{width:100%}}
.k-pc{background:var(--pc);color:#fff;border-radius:6px;padding:1px 4px}
.k-mem{text-decoration:underline;text-decoration-color:var(--mem);text-decoration-thickness:3px;text-underline-offset:4px;font-weight:600}
.k-place{border:2.5px solid var(--mem);border-radius:999px;padding:0 6px}
.k-prep{background:var(--prep);border-radius:6px;padding:1px 4px}
.k-vocab{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}

/* results / album */
.results{padding:26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.results h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,7vw,3.4rem);margin:0;line-height:1}
.bigstars{font-size:clamp(4rem,14vw,6rem);color:var(--led);letter-spacing:6px;line-height:1}
.bigstars .off{color:#D4DCE8}
.bigstars span{display:inline-block;animation:starIn .5s both}
.bigstars span:nth-child(2){animation-delay:.35s}.bigstars span:nth-child(3){animation-delay:.7s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.newsticker{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.newsticker .sticker{animation:flip .8s 1s both}
@keyframes flip{from{transform:rotateY(90deg) scale(.4)}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.sticker{border-radius:20px;padding:10px;text-align:center;border:3px dashed var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:4px}
.sticker svg{width:80px;height:80px}
.sticker b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.sticker small{font-size:.8rem;color:var(--muted)}
button.sticker.got{cursor:pointer}
.sticker.got{border:3px solid var(--led);background:#FFF8E6;transform:rotate(var(--r,0deg))}
.sticker.locked svg{filter:grayscale(1) brightness(1.5);opacity:.35}
.sec-title{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:820px){.hero,.game{grid-template-columns:minmax(0,1fr)}}
@media (max-width:460px){.brand b{display:none}.chip{padding:4px 9px 4px 6px}.adult{grid-template-columns:1fr}.track i{width:22px;height:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="board">
    <button class="brand" id="homeBtn" aria-label="Home">
      <svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#F26A1B"/><path d="M8 50h84M50 6v88M20 18q22 32 0 64M80 18q-22 32 0 64" stroke="#14306E" stroke-width="4" fill="none"/></svg>
      <b>Sports Day!</b>
    </button>
    <div class="chips">
      <div class="chip fire" id="fireChip" title="In a row" hidden><span class="emo" aria-hidden="true">🔥</span><strong id="cFire">0</strong></div>
      <div class="chip" title="Stars"><span class="emo" aria-hidden="true">⭐</span><strong id="cStars">0</strong></div>
      <div class="chip" title="Points"><span class="emo" aria-hidden="true">🏅</span><strong id="cPts">0</strong></div>
    </div>
  </header>
  <main id="screen"></main>
</div>
<canvas id="confetti" hidden></canvas>

<script>
/* ============ WORD LIST (only the study-guide table) ============ */
const VERBS=['bouncing','kicking','catching','running','hitting','throwing','jumping','cheering','teaching','scoring','walking','crawling'];
const BASE={bouncing:'bounce',kicking:'kick',catching:'catch',running:'run',hitting:'hit',throwing:'throw',jumping:'jump',cheering:'cheer',teaching:'teach',scoring:'score',walking:'walk',crawling:'crawl'};
const PREPS=['on','into','over','through','across','around'];
const PLACES=['track','bleacher','court','field','diamond','sand','circuit'];
const SPORTS=['basketball','volleyball','soccer','baseball','tennis'];
const VOCAB=['goal','bat','bar','whistle','megaphone','hoop','ball','hurdles','team','net','racquet','cones','chair','rope','stick'];
const FORMS={hurdles:['hurdles','hurdle'],cones:['cones','cone'],bleacher:['bleacher','bleachers'],fans:['fans','fan'],racquet:['racquet','racket']};
const PLURAL={runner:'runners',player:'players',athlete:'athletes',coach:'coaches',teacher:'teachers',goalkeeper:'goalkeepers'};

const MEMBER_WORDS=new Set(['player','players','goalkeeper','goalkeepers','runner','runners','athlete','athletes','coach','coaches','fan','fans','teacher','teachers']);
const PLACE_WORDS=new Set(['track','tracks','bleacher','bleachers','court','courts','field','fields','diamond','sand','circuit']);
const VERB_SET=new Set(VERBS), PREP_SET=new Set(PREPS);
const VOCAB_WORDS=new Set([...VOCAB,...SPORTS,'goals','bats','bars','whistles','megaphones','hoops','balls','hurdle','teams','nets','racquets','racket','cone','chairs','ropes','sticks']);

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/[^a-z' ]+/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim();
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function matchForms(text,forms){
  const n=norm(text),toks=n.split(' ').filter(Boolean);
  for(const f of forms) if((' '+n+' ').includes(' '+f+' ')) return {res:'ok',form:f};
  let best=null;
  for(const f of forms){const fw=f.split(' ').length;
    for(let i=0;i+fw<=toks.length;i++){const c=toks.slice(i,i+fw).join(' ');const d=lev(c,f);const tol=f.length>=7?2:1;
      if(d<=tol&&c[0]===f[0]&&(!best||d<best.d))best={d,form:f,cand:c}}}
  return best?{res:'almost',...best}:{res:'no'};
}
const formsOf=w=>FORMS[w]||[w];

/* ============ color-code analyzer (study-guide rubric) ============ */
function analyze(text){
  const parts=String(text).match(/[A-Za-z']+|[^A-Za-z']+/g)||[];
  const tags=parts.map(()=>null), wi=[];
  parts.forEach((p,i)=>{if(/^[A-Za-z']+$/.test(p))wi.push(i)});
  const W=wi.map(i=>parts[i].toLowerCase());
  const found={pc:0,mem:0,place:0,prep:0,vocab:0};let loose=false;
  for(let k=0;k<W.length;k++){
    const w=W[k],nx=W[k+1];
    if(['soccer','basketball','volleyball'].includes(w)&&(nx==='player'||nx==='players')){tags[wi[k]]=tags[wi[k+1]]='mem';found.mem++;k++;continue}
    if(['is','are','am'].includes(w)&&nx&&VERB_SET.has(nx)){tags[wi[k]]=tags[wi[k+1]]='pc';found.pc++;k++;continue}
    if(VERB_SET.has(w)){tags[wi[k]]='pc';loose=true;continue}
    if(MEMBER_WORDS.has(w)){tags[wi[k]]='mem';found.mem++;continue}
    if(PLACE_WORDS.has(w)){tags[wi[k]]='place';found.place++;continue}
    if(PREP_SET.has(w)){tags[wi[k]]='prep';found.prep++;continue}
    if(VOCAB_WORDS.has(w)){tags[wi[k]]='vocab';found.vocab++;continue}
  }
  let html='';
  for(let i=0;i<parts.length;i++){
    const t=tags[i];
    if(!t){html+=esc(parts[i]);continue}
    let chunk=esc(parts[i]);
    while(i+2<parts.length&&/^ +$/.test(parts[i+1])&&tags[i+2]===t&&t!=='vocab'&&t!=='prep'){chunk+=' '+esc(parts[i+2]);i+=2}
    html+=`<span class="k-${t}">${chunk}</span>`;
  }

function ringFor(a){
  if(a.ring) return a.ring;
  const boxes=a.figs.map(f=>person(f).box);
  const x0=Math.min(...boxes.map(b=>b.x0)),x1=Math.max(...boxes.map(b=>b.x1)),y0=Math.min(...boxes.map(b=>b.y0)),y1=Math.max(...boxes.map(b=>b.y1));
  return {cx:(x0+x1)/2,cy:(y0+y1)/2,rx:(x1-x0)/2+14,ry:(y1-y0)/2+12};
}
function labelPill(t,x,y){const w=t.length*7.6+14;x=Math.max(w/2+2,Math.min(478-w/2,x));y=Math.max(12,Math.min(290,y));
  return `<g><rect x="${x-w/2}" y="${y-10}" width="${w}" height="19" rx="9.5" fill="#fff" stroke="#14306E" stroke-width="1.4"/><text x="${x}" y="${y+4}" text-anchor="middle" font-family="Lexend,sans-serif" font-size="12" font-weight="700" fill="#14306E">${t}</text></g>`}
function sceneSVG(sc,opt={}){
  let figs='';
  sc.actors.forEach(a=>{(a.figs||[]).forEach(f=>figs+=person(f).svg);(a.extra||[]).forEach(f=>figs+=person(f).svg)});
  let over='';
  if(opt.hl){const a=sc.actors.find(x=>x.id===opt.hl);if(a){const r=ringFor(a);over+=`<ellipse class="ring" cx="${r.cx}" cy="${r.cy}" rx="${r.rx}" ry="${r.ry}"/>`}}
  if(opt.labels){
    sc.actors.forEach(a=>{const r=ringFor(a);const L=a.lbl||[r.cx,r.cy+r.ry+4];over+=labelPill(a.plural?(a.role==='fans'?'fans':PLURAL[a.role]||a.role):a.role,L[0],L[1])});
    (sc.labels||[]).forEach(([t,x,y])=>over+=labelPill(t,x,y));
  }
  return `<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(sc.name)} picture" fill="none">${sc.bg()}${figs}${sc.extras?sc.extras():''}${over}</svg>`;
}

/* ============ progress (kept in this browser) ============ */
const KEY='sportsDayEnglish.v1';
function load(){try{const p=JSON.parse(localStorage.getItem(KEY));if(p&&p.best)return p}catch(e){}return {best:{write:{},speak:{}},points:0,mode:'write',mute:false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(PR))}catch(e){}}
let PR=load();
const totalStars=()=>Object.values(PR.best.write).concat(Object.values(PR.best.speak)).reduce((a,b)=>a+b,0);
const stickersOwned=()=>Math.min(16,Math.floor(totalStars()/3));
let STREAK=0; // perfect answers in a row (this visit)
function setLeds(){
  $('#cPts').textContent=PR.points+(G?G.score+G.bonus:0);
  $('#cStars').textContent=totalStars();
  $('#cFire').textContent=STREAK;$('#fireChip').hidden=STREAK<2;
}
function popLed(id){const el=$(id);el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}

let AC=null;
function tone(seq){if(PR.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+.01;
  seq.forEach(([f,d,st,type='triangle',vol=.16])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+st);g.gain.linearRampToValueAtTime(vol,t0+st+.02);g.gain.exponentialRampToValueAtTime(.001,t0+st+d);
    o.connect(g).connect(AC.destination);o.start(t0+st);o.stop(t0+st+d+.05)})}catch(e){}}

/* ============ voice: speech out (TTS) and speech in (recognition) ============ */
let VOICE=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();VOICE=v.find(x=>/en-US/i.test(x.lang)&&/Google|Samantha|Aria|Jenny/i.test(x.name))||v.find(x=>/en-US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{speechSynthesis.cancel();if(!t)return;const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u)}catch(e){}}
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
let micState=SRC?'unknown':'none'; // unknown | ok | blocked | none
let REC=null;
function startListening({continuous,onText,onDone,onFail}){
  let rec;try{rec=new SRC()}catch(e){micState='blocked';onFail('blocked');return null}
  rec.lang='en-US';rec.interimResults=true;rec.maxAlternatives=4;rec.continuous=!!continuous;
  let finals=[],alts=[],ended=false,failed=false;
  rec.onresult=e=>{micState='ok';let interim='';finals=[];alts=[];
    for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){finals.push(r[0].transcript);for(let k=0;k<r.length;k++)alts.push(r[k].transcript)}else interim+=r[0].transcript}
    onText((finals.join(' ')+' '+interim).trim())};
  rec.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture','network'].includes(e.error)){micState='blocked';failed=true;onFail('blocked')}else if(e.error==='no-speech'){failed=true;onFail('nospeech')}};
  rec.onend=()=>{if(ended)return;ended=true;REC=null;if(failed)return;const full=finals.join(' ').trim();if(!full){onFail('nospeech');return}
    onDone(continuous?[full]:[full,...alts])};
  try{rec.start()}catch(e){micState='blocked';onFail('blocked');return null}
  REC=rec;return rec;
}
function stopListening(){try{REC&&REC.stop()}catch(e){}}

/* ============ questions ============ */
let G=null;
const roleTxt=a=>a.plural?(a.role==='fans'?'fans':PLURAL[a.role]||a.role):a.role;
function detFor(sc,a){const dup=sc.actors.filter(x=>x.role===a.role).length>1;return dup?(a.plural?'these':'this'):'the'}
function modelSentence(a){return `The ${roleTxt(a)} ${a.aux} ${a.verb}${a.obj?' the '+a.obj:''}${a.prep?` ${a.prep} the ${a.target}`:''}.`}
function roleForms(a){const f=[roleTxt(a)];if(!a.plural&&PLURAL[a.role.split(' ').pop()])f.push(a.role.replace(/(\w+)$/,m=>PLURAL[m]));if(a.plural&&a.role!=='fans')f.push(a.role);if(a.role==='fans')f.push('fan');if(/player$/.test(a.role)&&a.role!=='player')f.push('player');return f}

function qVerb(sc,a){const d=detFor(sc,a);return {type:'verb',part:1,actor:a.id,prompt:`What ${a.aux} ${d} ${roleTxt(a)} doing?`,forms:[a.verb,...(a.alt||[])],model:modelSentence(a),hintTxt:`${a.verb[0]} ${'_ '.repeat(a.verb.length-4)}ing`}}
function qWhere(sc,a){const d=detFor(sc,a);const place=a.where.split(' ').pop();return {type:'where',part:1,actor:a.id,prompt:`Where ${a.aux} ${d} ${roleTxt(a)}?`,forms:formsOf(place),prep:a.where.split(' ')[0],model:`The ${roleTxt(a)} ${a.aux} ${a.where}.`,hintTxt:`${a.where.split(' ')[0]} the ${place[0]}...`}}
function qWhich(word){const others=shuffle(VOCAB.filter(w=>w!==word)).slice(0,3);return {type:'which',part:2,prompt:`Which ${['cones','hurdles'].includes(word)?'are':'is'} the ${word}?`,word,choices:shuffle([word,...others]),model:`This is the ${word}.`,noLabels:true}}
function qSpell(word,mode){return {type:mode==='write'?'spell':'say',part:2,word,prompt:mode==='write'?'What is this? Write the word.':'What is this? Say the word.',forms:formsOf(word),model:word==='team'||word==='hurdles'||word==='cones'?`They are the ${word}.`:`It is a ${word}.`,hintTxt:word[0]+' _'.repeat(word.length-1),noLabels:true}}
function qBlanks(sc,a){const slots=[{w:roleTxt(a),forms:roleForms(a).filter(f=>f!=='player'||a.role==='player')},{w:a.verb,forms:[a.verb]}];
  if(a.prep)slots.push({w:a.prep,forms:[a.prep]});else slots.push({w:a.where.split(' ').pop(),forms:formsOf(a.where.split(' ').pop())});
  const tpl=a.prep?[`The`,0,a.aux,1,a.obj?`the ${a.obj}`:'',2,`the ${a.target}.`]:[`The`,0,a.aux,1,a.obj?`the ${a.obj}`:'',a.where.split(' ')[0]+' the',2,'.'];
  const model=a.prep?modelSentence(a):`The ${roleTxt(a)} ${a.aux} ${a.verb}${a.obj?' the '+a.obj:''} ${a.where}.`;
  return {type:'blanks',part:1,actor:a.id,prompt:'Complete the sentence.',slots,tpl:tpl.filter(x=>x!==''),model}}
function qWho(sc,a){return {type:'who',part:1,actor:null,prompt:`Who is ${a.verb}?`,forms:roleForms(a),model:modelSentence(a),hintTxt:roleTxt(a)[0]+'...'}}
function qSport(sc){const n=sc.sports.length;return {type:'sport',part:1,prompt:n>1?'Can you name three sports you can see?':'What sport can you see?',sports:sc.sports,need:Math.min(n,3),model:n>1?`I can see ${sc.sports.slice(0,-1).join(', ')} and ${sc.sports[n-1]}.`:`I can see ${sc.sports[0]}.`}}
function qSentence(){return {type:'sentence',part:3,prompt:'Write a sentence about the picture.',model:''}}
function qDescribe(){return {type:'describe',part:3,prompt:'Describe the picture. Use -ing words!',model:''}}

function buildRound(sc,mode){
  const A=shuffle(sc.actors),P=i=>A[i%A.length],items=shuffle(sc.items);
  if(mode==='write') return [qVerb(sc,P(0)),qWhere(sc,P(1)),qWhich(items[0]),qSpell(items[1]||items[0],mode),qBlanks(sc,P(2)),qSentence()];
  const uniq=sc.actors.filter(a=>sc.actors.filter(b=>b.verb===a.verb).length===1);
  const q5=sc.sports.length?qSport(sc):qWho(sc,rnd(uniq.length?uniq:sc.actors));
  return [qVerb(sc,P(0)),qWhere(sc,P(1)),qWhich(items[0]),qSpell(items[1]||items[0],mode),q5,qDescribe()];
}

/* ---- grading ---- */
function gradeText(q,texts,spoken){
  const almostPts=spoken?7:5;let best={pts:0,msg:'Look at the picture again.'};
  for(const t of texts){let r;
    if(q.type==='verb'){const m=matchForms(t,q.forms);
      if(m.res==='ok')r={pts:10,msg:'You used the -ing word!'};
      else if(m.res==='almost')r={pts:almostPts,msg:spoken?`Say it clearly: ${m.form}`:`${m.cand} → ${m.form}`};
      else{const b=q.forms.map(f=>BASE[f]).filter(Boolean);r=b.some(x=>(' '+norm(t)+' ').includes(' '+x+' '))?{pts:3,msg:'Add -ing!'}:{pts:0,msg:'What are they doing?'}}}
    else if(q.type==='where'){const m=matchForms(t,q.forms);const hasPrep=(' '+norm(t)+' ').includes(' '+q.prep+' ');
      if(m.res==='ok')r=hasPrep?{pts:10,msg:'Perfect place!'}:{pts:8,msg:`Add: ${q.prep} the ${m.form}`};
      else if(m.res==='almost')r={pts:almostPts,msg:spoken?`Say: ${q.prep} the ${m.form}`:`${m.cand} → ${m.form}`};
      else r={pts:0,msg:'Look at the ground.'}}
    else if(q.type==='spell'||q.type==='say'||q.type==='who'){const m=matchForms(t,q.forms);
      r=m.res==='ok'?{pts:10,msg:'Great word!'}:m.res==='almost'?{pts:almostPts,msg:spoken?`Say: ${m.form}`:`${m.cand} → ${m.form}`}:{pts:0,msg:'Try again!'}}
    else if(q.type==='sport'){let n=0;q.sports.forEach(s=>{if(matchForms(t,[s]).res!=='no')n++});
      r={pts:Math.round(10*Math.min(n,q.need)/q.need),msg:n>=q.need?'You found them!':`${n} of ${q.need}. Look again!`}}
    if(r.pts>best.pts||!best.set){best={...r,set:true}}
  }
  return best;
}
const MISSING={pc:'Add is + -ing (is kicking).',mem:'Who? coach, runner, fans...',place:'Where? field, court, track...',prep:'Add on, into, over, through, across, around.',vocab:'Add a thing: ball, net, hoop...'};
function gradeSentence(text,spoken){
  const r=analyze(text);const pts=r.count*2;const miss=Object.keys(MISSING).filter(k=>!r.found[k]);
  let msg=miss.length?MISSING[miss[0]]:'All five colors!';
  if(!r.found.pc&&r.loose)msg='Add is or are before the -ing word.';
  const tips=[];
  if(!spoken){if(!/^[A-Z]/.test(text.trim()))tips.push('Capital letter!');if(!/\.\s*$/.test(text))tips.push('Period at the end.')}
  if(r.found.mem&&(r.found.pc||r.loose)&&!pictureMatch(r.words,G.scene))tips.push('Is that in the picture?');
  return {pts,msg,colored:r.html,tips};
}
function gradeBlanks(q){
  let sum=0,all=true;
  q.slots.forEach((s,i)=>{const el=$('#bl'+i);const m=matchForms(el.value,s.forms);const v=m.res==='ok'?1:m.res==='almost'?.5:0;sum+=v;if(v<1)all=false;
    el.classList.toggle('ok',v===1);el.classList.toggle('bad',v<1)});
  afterGrade(q,{pts:Math.round(10*sum/q.slots.length),msg:all?'':'Fix the red ones.'});
}
function pickChoice(q,b){
  if(q.done)return;q.tries++;
  if(b.dataset.w===q.word){b.classList.add('right');finish(q,{pts:q.tries===1?10:5,msg:''})}
  else{b.classList.add('wrong');b.disabled=true;SFX.bad();
    if(q.tries>=2){screen.querySelector(`.choice[data-w="${q.word}"]`).classList.add('right');finish(q,{pts:0,msg:''})}
    else showMsg('try','🙈','Try again!','')}
}
function afterGrade(q,res){
  if(q.done)return;q.tries++;
  let pts=res.pts;if(q.tries>1)pts=Math.min(pts,8);if(q.hint)pts=Math.max(0,pts-2);
  q.best=Math.max(q.best||0,pts);
  if(res.pts>=10||q.tries>=2) return finish(q,{...res,pts:q.best});
  const close=res.pts>=5;(close?SFX.almost:SFX.bad)();
  const qp=$('#qp');qp.classList.remove('shake');void qp.offsetWidth;qp.classList.add('shake');
  showMsg(close?'almost':'try',close?'🤏':'🙈',close?'Almost!':'Try again!',`<div class="msg">${esc(res.msg)}</div>`+(res.colored?`<div class="model">${res.colored}</div>`:'')+(res.tips&&res.tips.length?`<div class="note">${res.tips.map(esc).join(' ')}</div>`:''),
    `<button class="btn btn-ic" id="showAns" aria-label="Show answer">${E('👀')}</button><button class="btn btn-primary" id="retry" style="font-size:1.3rem">🔁 Again</button>`);
  $('#retry').onclick=()=>{$('#fb').innerHTML='';const a=$('#ans');if(a){a.focus();a.select?.()}else if($('#micBtn')){$('#heard').textContent='Tap and talk!'}else{const f=screen.querySelector('.blank.bad');f&&f.focus()}};
  $('#showAns').onclick=()=>finish(q,{...res,pts:q.best});
}
function modelHTML(q){
  if(q.type==='sentence'||q.type==='describe'){const ex=shuffle(G.scene.actors).slice(0,q.type==='describe'?3:1).map(modelSentence).join(' ');return analyze(ex).html}
  return analyze(q.model).html;
}
function showMsg(kind,emo,title,html,buttons=''){
  $('#fb').innerHTML=`<div class="fb ${kind}"><div class="verdict">${E(emo)}<span>${title}</span></div>${html}${buttons?`<div class="actions">${buttons}</div>`:''}</div>`;
}
function goNext(){clearTimeout(AUTO);G.i++;if(G.i>=G.qs.length)renderResults();else renderGame()}
function finish(q,res){
  if(q.done)return;q.done=true;stopListening();
  const pts=Math.max(0,Math.min(10,res.pts));q.pts=pts;G.score+=pts;
  let bonus=0;
  if(pts>=10){STREAK++;bonus=STREAK>=5?5:STREAK>=3?3:STREAK>=2?1:0}else STREAK=0;
  G.bonus+=bonus;
  setLeds();if(pts>0)popLed('#cPts');if(bonus)popLed('#cFire');
  $('#track').innerHTML=trackHTML();
  const kind=pts>=10?'great':pts>=5?'almost':'try';
  const emo=pts>=10?rnd(['🎉','⚽','🏆','🌟','💪']):pts>=5?'👍':'💪';
  const title=pts>=10?rnd(['Great job!','Super!','Goal!','Awesome!']):pts>=5?'Good try!':'Keep going!';
  const answerKey=(q.type==='which'||q.type==='spell'||q.type==='say')?`<b style="font-size:1.5rem">${q.word}</b> · `:'';
  const last=G.i+1>=G.qs.length,auto=pts>=10&&q.part<3&&!last;
  showMsg(kind,emo,`${title} <span class="pts">+${pts}</span>${bonus?` <span class="combo">🔥${STREAK} +${bonus}</span>`:''}`,
    `${pts<10&&res.msg?`<div class="msg">${esc(res.msg)}</div>`:''}${res.colored&&pts<10?`<div class="model">${res.colored}</div>`:''}${res.tips&&res.tips.length?`<div class="note">${res.tips.map(esc).join(' ')}</div>`:''}
     <div class="model">${answerKey}${modelHTML(q)}</div>`,
    `<button class="btn btn-ic" id="listenM" aria-label="Listen">${E('🔊')}</button><button class="btn btn-primary next" id="nextBtn" aria-label="${last?'See my stars':'Next'}">${auto?`<span class="fill" style="animation-duration:${AUTO_MS}ms"></span>`:''}${last?'⭐⭐⭐':'▶'}</button>`);
  const models=$('#fb').querySelectorAll('.model'),spoken=(models[models.length-1]?.textContent||q.model||'').replace(/·/g,'.');
  (pts>=10?(bonus?SFX.combo:SFX.good):pts>=5?SFX.almost:SFX.bad)();
  setTimeout(()=>{if(G&&G.qs[G.i]===q)say(spoken)},450);
  $('#listenM').onclick=()=>{clearTimeout(AUTO);$('#nextBtn .fill')?.remove();say(spoken)};
  $('#nextBtn').onclick=goNext;
  $('#nextBtn').focus({preventScroll:true});
  if(auto) AUTO=setTimeout(goNext,AUTO_MS);
  screen.querySelectorAll('#qp input, #qp textarea, #checkBtn, #hintBtn, #micBtn, #revealBtn').forEach(el=>el.disabled=true);
  if(pts>=10)burst(bonus?80:40);
}

/* ---- results & prizes ---- */
function renderResults(){
  clearTimeout(AUTO);
  const sc=G.scene,mode=G.mode,max=G.qs.length*10,pct=G.score/max,earned=G.score+G.bonus;
  const stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  const before=stickersOwned(),prevBest=PR.best[mode][sc.id]||0;
  PR.best[mode][sc.id]=Math.max(prevBest,stars);PR.points+=earned;save();
  const after=stickersOwned(),fresh=STICKERS.slice(before,after),ts=totalStars();
  G=null;setLeds();popLed('#cStars');
  const title=stars===3?'Champion!':stars===2?'Great game!':stars===1?'Good game!':'Keep training!';
  const nextSc=nextScene(mode,sc);
  screen.innerHTML=`<section class="card results">
    <div class="bigstars" aria-label="${stars} of 3 stars">${Array.from({length:3},(_,i)=>`<span class="${i<stars?'':'off'}">★</span>`).join('')}</div>
    <h2>${title}</h2>
    <p class="pts" style="margin:0;font-size:1.5rem">🏅 +${earned}${stars>prevBest&&prevBest>0?' · NEW BEST!':''}</p>
    ${fresh.length?`<div class="newsticker">${fresh.map(([k,w],i)=>`<button class="sticker got" data-say="${w}" style="--r:${i%2?3:-3}deg;width:140px">${icon(k,w)}<b>${w}</b></button>`).join('')}</div>`:
      after<16?`<button class="gift" id="albumBtn" style="width:min(100%,360px)" aria-label="Stickers">${E('🎁')}<span class="meter"><i style="width:${(ts%3)/3*100}%"></i></span><b>+${3-ts%3} ⭐</b></button>`:''}
    <button class="play" id="nextB" style="width:min(100%,360px)">${PLAY_TRI}NEXT</button>
    <div class="row" style="justify-content:center"><button class="btn btn-ic" id="homeB" aria-label="Home">${E('🏠')}</button><button class="btn btn-ic" id="againB" aria-label="Play again">${E('🔁')}</button><button class="btn btn-ic" id="albB" aria-label="Sticker album">${E('📒')}</button></div></section>`;
  $('#homeB').onclick=renderHome;$('#againB').onclick=()=>startRound(sc.id);$('#nextB').onclick=()=>startRound(nextSc.id);
  $('#albB').onclick=renderAlbum;if($('#albumBtn'))$('#albumBtn').onclick=renderAlbum;
  screen.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
  SFX.win();say(title);
  if(fresh.length)setTimeout(()=>{SFX.sticker();say('New sticker! '+fresh.map(f=>f[1]).join(', '))},1300);
  burst(stars>=2?160:70);window.scrollTo(0,0);
}
function renderAlbum(){
  clearTimeout(AUTO);stopListening();G=null;setLeds();const own=stickersOwned();
  screen.innerHTML=`<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:14px">
    <div class="row" style="justify-content:space-between"><h2 class="sec-title">📒 ${own}/16</h2><button class="btn btn-ic" id="backB" aria-label="Home">${E('🏠')}</button></div>
    <div class="album">${STICKERS.map(([k,w],i)=>i<own?`<button class="sticker got" style="--r:${(i%3-1)*3}deg" data-say="${w}" aria-label="Listen to ${w}">${icon(k,w)}<b>${w}</b></button>`:`<div class="sticker locked">${icon(k,'locked sticker')}<b>🔒</b><small>${(i+1)*3} ⭐</small></div>`).join('')}</div></section>`;
  $('#backB').onclick=renderHome;
  screen.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{SFX.tap();say(b.dataset.say)});
  window.scrollTo(0,0);
}

/* ---- confetti ---- */
function burst(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d');cv.hidden=false;cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#F26A1B','#FFB627','#2F6FE0','#2FA35B','#E85A9A','#14306E'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*360,c:rnd(cols),s:6+Math.random()*6}));
  let t=0;(function f(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=8;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(++t<110)requestAnimationFrame(f);else{ctx.clearRect(0,0,cv.width,cv.height);cv.hidden=true}})();
}

$('#homeBtn').onclick=renderHome;
renderHome();
</script>
