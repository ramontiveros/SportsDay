<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sports Day English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;600;700&family=Lilita+One&display=swap">
<style>
/* Layout: navy scoreboard band on top; picture card + question card side by side, stacked on phones */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E6F0FA; --ink:#17254A; --muted:#55668A; --navy:#14306E; --navy-2:#0C1F4D;
  --orange:#F26A1B; --orange-d:#B9490A; --grass:#2E9A4E; --grass-d:#1C6E35;
  --card:#FFFFFF; --line:#C6D6EC; --led:#FFB627; --soft:#F2F7FD;
  --pc:#E0262B; --mem:#D02BC0; --prep:#FFE24A; --good:#178F4B; --warn:#D07A00; --bad:#D23A3A;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-led:'Bungee','Arial Black',Impact,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0}
img{max-width:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
#app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* scoreboard */
.board{background:var(--navy);color:#fff;border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 5px 0 var(--navy-2)}
.brand{text-align:left;display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;padding:4px 0;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.02em;line-height:1;text-align:left}
.brand small{display:block;font-size:.72rem;opacity:.75;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.leds{display:flex;gap:8px;flex-wrap:wrap}
.led{background:var(--navy-2);border-radius:10px;padding:4px 10px 6px;text-align:center;min-width:76px}
.led span{display:block;font-size:.62rem;letter-spacing:.14em;font-weight:700;opacity:.8}
.led strong{font-family:var(--f-led);color:var(--led);font-size:1.3rem;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums;display:inline-block}
.led strong.pop{animation:pop .6s ease}
@keyframes pop{30%{transform:scale(1.35);color:#fff}}

.card{background:var(--card);border-radius:18px;border:2px solid var(--line)}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-size:1rem;background:var(--soft);color:var(--ink);
  box-shadow:0 4px 0 var(--line);transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
.btn-primary:active{box-shadow:0 1px 0 var(--orange-d)}
.btn-green{background:var(--grass);color:#fff;box-shadow:0 4px 0 var(--grass-d)}
.btn-green:active{box-shadow:0 1px 0 var(--grass-d)}
.btn-sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.hero-main{padding:22px;display:flex;flex-direction:column;gap:16px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,5vw,3rem);line-height:1;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:3px solid var(--line);background:var(--soft);border-radius:16px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center}
.mode svg{flex:none;width:42px;height:42px}
.mode b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.3rem;line-height:1.1}
.mode small{color:var(--muted);font-size:.8rem;line-height:1.3;display:block}
.mode[aria-pressed="true"]{border-color:var(--orange);background:#FFF1E8}
.shelf{padding:18px;display:flex;flex-direction:column;gap:12px}
.shelf h2,.sec-title{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:0}
.trophies{display:flex;gap:10px;justify-content:space-around;align-items:flex-end}
.trophy{text-align:center;font-size:.75rem;font-weight:700;color:var(--muted)}
.trophy svg{width:64px;height:64px;display:block;margin:0 auto}
.trophy.locked svg{filter:grayscale(1);opacity:.3}
.meter{height:12px;border-radius:99px;background:var(--soft);border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--led),var(--orange));border-radius:99px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem}
.note{font-size:.8rem;color:var(--muted);margin:0}
.scene-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.scene-card{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;border:2px solid var(--line);background:var(--card);border-radius:16px;transition:transform .12s}
.scene-card:hover{transform:translateY(-3px);border-color:var(--orange)}
.scene-card svg{display:block;width:100%;height:auto}
.scene-card .sc-body{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.scene-card b{font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.stars{display:inline-flex;gap:1px;color:var(--led);font-size:1rem;letter-spacing:1px;white-space:nowrap}
.stars .off{color:#D4DCE8}
.medals{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);font-weight:600;line-height:1.2}

/* game */
.game{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.pic{padding:10px;display:flex;flex-direction:column;gap:8px}
.pic-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px}
.place-tag{font-family:var(--f-display);font-size:1.15rem}
.pic svg{display:block;width:100%;height:auto;border-radius:12px}
.ring{fill:none;stroke:var(--orange);stroke-width:3.5;stroke-dasharray:10 7;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-34}}
.qpanel{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qtag{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.done{background:var(--grass)}
.dots i.now{background:var(--orange)}
.prompt{display:flex;gap:10px;align-items:flex-start}
.prompt h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.5rem,3.4vw,2rem);line-height:1.15;margin:0;flex:1;text-wrap:balance}
.speak-btn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);box-shadow:0 3px 0 var(--line);display:grid;place-items:center}
.speak-btn svg{width:24px;height:24px}
.ans{width:100%;font:inherit;font-size:1.35rem;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink)}
.ans:focus{border-color:var(--orange);outline:none}
textarea.ans{min-height:96px;resize:vertical;font-size:1.15rem}
.big-icon{display:grid;place-items:center;background:var(--soft);border-radius:16px;padding:10px}
.big-icon svg{width:130px;height:130px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:var(--soft);border:3px solid var(--line);border-radius:16px;padding:8px;display:grid;place-items:center}
.choice svg{width:100%;max-width:110px;height:auto;aspect-ratio:1}
.choice.right{border-color:var(--good);background:#E3F6EA}
.choice.wrong{border-color:var(--bad);background:#FCE6E6;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.blanks{font-size:1.3rem;line-height:2.4}
.blank{font:inherit;font-size:1.15rem;width:8.5em;max-width:100%;padding:2px 8px;border:0;border-bottom:3px solid var(--ink);background:var(--soft);border-radius:8px 8px 0 0;color:var(--ink)}
.blank.ok{border-color:var(--good);background:#E3F6EA}
.blank.bad{border-color:var(--bad);background:#FCE6E6}
.preview{min-height:2.2em;font-size:1.15rem;padding:8px 10px;border-radius:12px;background:var(--soft)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.85rem;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:6px;align-items:center}
.checks li::before{content:"";width:14px;height:14px;border-radius:4px;border:2px solid var(--line);flex:none}
.checks li.on::before{background:var(--good);border-color:var(--good)}
.voice{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--orange);box-shadow:0 6px 0 var(--orange-d);display:grid;place-items:center}
.mic svg{width:44px;height:44px}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(210,58,58,.55),0 6px 0 #8f2222}100%{box-shadow:0 0 0 26px rgba(210,58,58,0),0 6px 0 #8f2222}}
.heard{text-align:center;color:var(--muted);min-height:1.5em}
.heard q{color:var(--ink);font-weight:600}
.saybox{background:var(--soft);border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.saybox .say-big{font-family:var(--f-display);font-size:1.6rem;margin:0}
.adult{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.great{background:#E3F6EA}
.fb.almost{background:#FFF3D6}
.fb.try{background:#FCE9E9}
.fb .verdict{font-family:var(--f-display);font-size:1.5rem;line-height:1}
.fb.great .verdict{color:var(--good)} .fb.almost .verdict{color:var(--warn)} .fb.try .verdict{color:var(--bad)}
.fb .model{font-size:1.15rem;line-height:1.9}
.pts{font-family:var(--f-led);font-size:1rem;color:var(--orange)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.k-pc{background:var(--pc);color:#fff;border-radius:6px;padding:1px 4px}
.k-mem{text-decoration:underline;text-decoration-color:var(--mem);text-decoration-thickness:3px;text-underline-offset:4px;font-weight:600}
.k-place{border:2.5px solid var(--mem);border-radius:999px;padding:0 6px}
.k-prep{background:var(--prep);border-radius:6px;padding:1px 4px}
.k-vocab{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}

/* results / album */
.results{padding:26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.results h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,6vw,3rem);margin:0;line-height:1}
.bigstars{font-size:clamp(3rem,10vw,4.5rem);color:var(--led);letter-spacing:6px;line-height:1}
.bigstars .off{color:#D4DCE8}
.bigstars span{display:inline-block;animation:starIn .5s both}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.newsticker{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.sticker{border-radius:18px;padding:10px;text-align:center;border:3px dashed var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:4px}
.sticker svg{width:76px;height:76px}
.sticker b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.sticker small{font-size:.7rem;color:var(--muted)}
.sticker.got{border:3px solid var(--led);background:#FFF8E6;transform:rotate(var(--r,0deg))}
.sticker.locked svg{filter:grayscale(1) brightness(1.5);opacity:.35}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:820px){.hero,.game{grid-template-columns:minmax(0,1fr)}}
@media (max-width:460px){.modes{grid-template-columns:1fr}.leds .led{min-width:62px;padding:3px 7px}.brand b{font-size:1.15rem}.adult{grid-template-columns:1fr}.checks{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="board">
    <button class="brand" id="homeBtn" aria-label="Go to the start screen">
      <svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#F26A1B"/><path d="M8 50h84M50 6v88M20 18q22 32 0 64M80 18q-22 32 0 64" stroke="#14306E" stroke-width="4" fill="none"/></svg>
      <span><b>Sports Day English</b><small>Belmont · 2nd grade · Trimester 1</small></span>
    </button>
    <div class="leds">
      <div class="led"><span id="ledL1">POINTS</span><strong id="led1">0</strong></div>
      <div class="led"><span>STARS</span><strong id="led2">0</strong></div>
      <div class="led"><span id="ledL3">LEVEL</span><strong id="led3" style="font-size:.95rem">ROOKIE</strong></div>
    </div>
  </header>
  <main id="screen"></main>
</div>
<canvas id="confetti" hidden></canvas>

<script>
/* ============ WORD LIST (only the study-guide table) ============ */
const VERBS=['bouncing','kicking','catching','running','hitting','throwing','jumping','cheering','teaching','scoring','walking','crawling'];
const BASE={bouncing:'bounce',kicking:'kick',catching:'catch',running:'run',hitting:'hit',throwing:'throw',jumping:'jump',cheering:'cheer',teaching:'teach',scoring:'score',walking:'walk',crawling:'crawl'};
const PREPS=['on','into','over','through','across','around'];
const PLACES=['track','bleacher','court','field','diamond','sand','circuit'];
const SPORTS=['basketball','volleyball','soccer','baseball','tennis'];
const VOCAB=['goal','bat','bar','whistle','megaphone','hoop','ball','hurdles','team','net','racquet','cones','chair','rope','stick'];
const FORMS={hurdles:['hurdles','hurdle'],cones:['cones','cone'],bleacher:['bleacher','bleachers'],fans:['fans','fan'],racquet:['racquet','racket']};
const PLURAL={runner:'runners',player:'players',athlete:'athletes',coach:'coaches',teacher:'teachers',goalkeeper:'goalkeepers'};

const MEMBER_WORDS=new Set(['player','players','goalkeeper','goalkeepers','runner','runners','athlete','athletes','coach','coaches','fan','fans','teacher','teachers']);
const PLACE_WORDS=new Set(['track','tracks','bleacher','bleachers','court','courts','field','fields','diamond','sand','circuit']);
const VERB_SET=new Set(VERBS), PREP_SET=new Set(PREPS);
const VOCAB_WORDS=new Set([...VOCAB,...SPORTS,'goals','bats','bars','whistles','megaphones','hoops','balls','hurdle','teams','nets','racquets','racket','cone','chairs','ropes','sticks']);

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/[^a-z' ]+/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim();
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function matchForms(text,forms){
  const n=norm(text),toks=n.split(' ').filter(Boolean);
  for(const f of forms) if((' '+n+' ').includes(' '+f+' ')) return {res:'ok',form:f};
  let best=null;
  for(const f of forms){const fw=f.split(' ').length;
    for(let i=0;i+fw<=toks.length;i++){const c=toks.slice(i,i+fw).join(' ');const d=lev(c,f);const tol=f.length>=7?2:1;
      if(d<=tol&&c[0]===f[0]&&(!best||d<best.d))best={d,form:f,cand:c}}}
  return best?{res:'almost',...best}:{res:'no'};
}
const formsOf=w=>FORMS[w]||[w];

/* ============ color-code analyzer (study-guide rubric) ============ */
function analyze(text){
  const parts=String(text).match(/[A-Za-z']+|[^A-Za-z']+/g)||[];
  const tags=parts.map(()=>null), wi=[];
  parts.forEach((p,i)=>{if(/^[A-Za-z']+$/.test(p))wi.push(i)});
  const W=wi.map(i=>parts[i].toLowerCase());
  const found={pc:0,mem:0,place:0,prep:0,vocab:0};let loose=false;
  for(let k=0;k<W.length;k++){
    const w=W[k],nx=W[k+1];
    if(['soccer','basketball','volleyball'].includes(w)&&(nx==='player'||nx==='players')){tags[wi[k]]=tags[wi[k+1]]='mem';found.mem++;k++;continue}
    if(['is','are','am'].includes(w)&&nx&&VERB_SET.has(nx)){tags[wi[k]]=tags[wi[k+1]]='pc';found.pc++;k++;continue}
    if(VERB_SET.has(w)){tags[wi[k]]='pc';loose=true;continue}
    if(MEMBER_WORDS.has(w)){tags[wi[k]]='mem';found.mem++;continue}
    if(PLACE_WORDS.has(w)){tags[wi[k]]='place';found.place++;continue}
    if(PREP_SET.has(w)){tags[wi[k]]='prep';found.prep++;continue}
    if(VOCAB_WORDS.has(w)){tags[wi[k]]='vocab';found.vocab++;continue}
  }
  let html='';
  for(let i=0;i<parts.length;i++){
    const t=tags[i];
    if(!t){html+=esc(parts[i]);continue}
    let chunk=esc(parts[i]);
    while(i+2<parts.length&&/^ +$/.test(parts[i+1])&&tags[i+2]===t&&t!=='vocab'&&t!=='prep'){chunk+=' '+esc(parts[i+2]);i+=2}
    html+=`<span class="k-${t}">${chunk}</span>`;
  }
  const count=Object.values(found).filter(v=>v>0).length;
  return {html,found,loose,count,words:W};
}
function pictureMatch(words,scene){
  const has=w=>words.includes(w);
  return scene.actors.some(a=>{
    const last=a.role.split(' ').pop();
    const roleOk=a.role==='team'?has('team'):a.role==='fans'?(has('fans')||has('fan')):(has(last)||has(PLURAL[last]||'#')||(last==='player'&&(has('player')||has('players'))));
    const verbs=[a.verb,...(a.alt||[])];
    return roleOk&&verbs.some(has);
  });
}

/* ============ drawing: people ============ */
const SK=['#F4C9A8','#DDA77C','#B5794F','#7E5034'];
const HR=['#3A2416','#8A5326','#1C1714','#D19A3E'];
const C={blue:'#2F6FE0',red:'#E2453C',green:'#2FA35B',yellow:'#F2B92E',teal:'#16A39C',purple:'#8A55D6',orange:'#F2862E',navy:'#1F3566',pink:'#E85A9A'};
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(v*(1+amt))));return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
const POSES={
  stand:{aF:[12,6],aB:[-12,-6],lF:[4,0],lB:[-4,0]},
  walk:{aF:[28,40],aB:[-28,-20],lF:[22,8],lB:[-20,-10],hip:25},
  run:{aF:[55,135],aB:[-55,5],lF:[55,0],lB:[-35,-95],lean:12,hip:21},
  kick:{aF:[80,100],aB:[-75,-95],lF:[80,95],lB:[-4,0],lean:-10},
  jump:{aF:[165,175],aB:[155,170],lF:[55,-25],lB:[35,-40],lift:22,hip:22},
  spike:{aF:[168,172],aB:[-40,-20],lF:[40,-20],lB:[20,-40],lift:26,hip:22},
  leap:{aF:[150,165],aB:[-60,-40],lF:[85,85],lB:[-60,-115],lift:24,hip:22,lean:8},
  cheer:{aF:[150,165],aB:[-150,-165],lF:[4,0],lB:[-4,0]},

function ringFor(a){
  if(a.ring) return a.ring;
  const boxes=a.figs.map(f=>person(f).box);
  const x0=Math.min(...boxes.map(b=>b.x0)),x1=Math.max(...boxes.map(b=>b.x1)),y0=Math.min(...boxes.map(b=>b.y0)),y1=Math.max(...boxes.map(b=>b.y1));
  return {cx:(x0+x1)/2,cy:(y0+y1)/2,rx:(x1-x0)/2+14,ry:(y1-y0)/2+12};
}
function labelPill(t,x,y){const w=t.length*7.6+14;x=Math.max(w/2+2,Math.min(478-w/2,x));y=Math.max(12,Math.min(290,y));
  return `<g><rect x="${x-w/2}" y="${y-10}" width="${w}" height="19" rx="9.5" fill="#fff" stroke="#14306E" stroke-width="1.4"/><text x="${x}" y="${y+4}" text-anchor="middle" font-family="Lexend,sans-serif" font-size="12" font-weight="700" fill="#14306E">${t}</text></g>`}
function sceneSVG(sc,opt={}){
  let figs='';
  sc.actors.forEach(a=>{(a.figs||[]).forEach(f=>figs+=person(f).svg);(a.extra||[]).forEach(f=>figs+=person(f).svg)});
  let over='';
  if(opt.hl){const a=sc.actors.find(x=>x.id===opt.hl);if(a){const r=ringFor(a);over+=`<ellipse class="ring" cx="${r.cx}" cy="${r.cy}" rx="${r.rx}" ry="${r.ry}"/>`}}
  if(opt.labels){
    sc.actors.forEach(a=>{const r=ringFor(a);const L=a.lbl||[r.cx,r.cy+r.ry+4];over+=labelPill(a.plural?(a.role==='fans'?'fans':PLURAL[a.role]||a.role):a.role,L[0],L[1])});
    (sc.labels||[]).forEach(([t,x,y])=>over+=labelPill(t,x,y));
  }
  return `<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(sc.name)} picture" fill="none">${sc.bg()}${figs}${sc.extras?sc.extras():''}${over}</svg>`;
}

const KEY='sportsDayEnglish.v1';

function save(){try{localStorage.setItem(KEY,JSON.stringify(PR))}catch(e){}}

const totalStars=()=>Object.values(PR.best.write).concat(Object.values(PR.best.speak)).reduce((a,b)=>a+b,0);
const stickersOwned=()=>Math.min(16,Math.floor(totalStars()/3));

  if(mode==='game'){$('#ledL1').textContent='ROUND';$('#led1').textContent=G.score;$('#ledL3').textContent='QUESTION';$('#led3').textContent=`${Math.min(G.i+1,G.qs.length)}/${G.qs.length}`;$('#led3').style.fontSize=''}
  else{$('#ledL1').textContent='POINTS';$('#led1').textContent=PR.points;$('#ledL3').textContent='LEVEL';$('#led3').textContent=levelName(PR.points);$('#led3').style.fontSize='.95rem'}
  $('#led2').textContent=totalStars();
}

/* ============ voice: speech out (TTS) and speech in (recognition) ============ */
let VOICE=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();VOICE=v.find(x=>/en-US/i.test(x.lang)&&/Google|Samantha|Aria|Jenny/i.test(x.name))||v.find(x=>/en-US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u)}catch(e){}}
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
let micState=SRC?'unknown':'none'; // unknown | ok | blocked | none
let REC=null;
function startListening({continuous,onText,onDone,onFail}){
  let rec;try{rec=new SRC()}catch(e){micState='blocked';onFail('blocked');return null}
  rec.lang='en-US';rec.interimResults=true;rec.maxAlternatives=4;rec.continuous=!!continuous;
  let finals=[],alts=[],ended=false,failed=false;
  rec.onresult=e=>{micState='ok';let interim='';finals=[];alts=[];
    for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){finals.push(r[0].transcript);for(let k=0;k<r.length;k++)alts.push(r[k].transcript)}else interim+=r[0].transcript}
    onText((finals.join(' ')+' '+interim).trim())};
  rec.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture','network'].includes(e.error)){micState='blocked';failed=true;onFail('blocked')}else if(e.error==='no-speech'){failed=true;onFail('nospeech')}};
  rec.onend=()=>{if(ended)return;ended=true;REC=null;if(failed)return;const full=finals.join(' ').trim();if(!full){onFail('nospeech');return}
    onDone(continuous?[full]:[full,...alts])};
  try{rec.start()}catch(e){micState='blocked';onFail('blocked');return null}
  REC=rec;return rec;
}
function stopListening(){try{REC&&REC.stop()}catch(e){}}

let G=null;
const roleTxt=a=>a.plural?(a.role==='fans'?'fans':PLURAL[a.role]||a.role):a.role;
function detFor(sc,a){const dup=sc.actors.filter(x=>x.role===a.role).length>1;return dup?(a.plural?'these':'this'):'the'}
function modelSentence(a){return `The ${roleTxt(a)} ${a.aux} ${a.verb}${a.obj?' the '+a.obj:''}${a.prep?` ${a.prep} the ${a.target}`:''}.`}
function roleForms(a){const f=[roleTxt(a)];if(!a.plural&&PLURAL[a.role.split(' ').pop()])f.push(a.role.replace(/(\w+)$/,m=>PLURAL[m]));if(a.plural&&a.role!=='fans')f.push(a.role);if(a.role==='fans')f.push('fan');if(/player$/.test(a.role)&&a.role!=='player')f.push('player');return f}

function qVerb(sc,a){const d=detFor(sc,a);return {type:'verb',part:1,actor:a.id,prompt:`What ${a.aux} ${d} ${roleTxt(a)} doing?`,forms:[a.verb,...(a.alt||[])],model:modelSentence(a),hintTxt:`${a.verb[0]} ${'_ '.repeat(a.verb.length-4)}ing`}}
function qWhere(sc,a){const d=detFor(sc,a);const place=a.where.split(' ').pop();return {type:'where',part:1,actor:a.id,prompt:`Where ${a.aux} ${d} ${roleTxt(a)}?`,forms:formsOf(place),prep:a.where.split(' ')[0],model:`The ${roleTxt(a)} ${a.aux} ${a.where}.`,hintTxt:`${a.where.split(' ')[0]} the ${place[0]}...`}}
function qWhich(word){const others=shuffle(VOCAB.filter(w=>w!==word)).slice(0,3);return {type:'which',part:2,prompt:`Which ${['cones','hurdles'].includes(word)?'are':'is'} the ${word}?`,word,choices:shuffle([word,...others]),model:`This is the ${word}.`,noLabels:true}}
function qSpell(word,mode){return {type:mode==='write'?'spell':'say',part:2,word,prompt:mode==='write'?'What is this? Write the word.':'What is this? Say the word.',forms:formsOf(word),model:word==='team'||word==='hurdles'||word==='cones'?`They are the ${word}.`:`It is a ${word}.`,hintTxt:word[0]+' _'.repeat(word.length-1),noLabels:true}}
function qBlanks(sc,a){const slots=[{w:roleTxt(a),forms:roleForms(a).filter(f=>f!=='player'||a.role==='player')},{w:a.verb,forms:[a.verb]}];
  if(a.prep)slots.push({w:a.prep,forms:[a.prep]});else slots.push({w:a.where.split(' ').pop(),forms:formsOf(a.where.split(' ').pop())});
  const tpl=a.prep?[`The`,0,a.aux,1,a.obj?`the ${a.obj}`:'',2,`the ${a.target}.`]:[`The`,0,a.aux,1,a.obj?`the ${a.obj}`:'',a.where.split(' ')[0]+' the',2,'.'];
  const model=a.prep?modelSentence(a):`The ${roleTxt(a)} ${a.aux} ${a.verb}${a.obj?' the '+a.obj:''} ${a.where}.`;
  return {type:'blanks',part:1,actor:a.id,prompt:'Complete the sentence.',slots,tpl:tpl.filter(x=>x!==''),model}}
function qWho(sc,a){return {type:'who',part:1,actor:null,prompt:`Who is ${a.verb}?`,forms:roleForms(a),model:modelSentence(a),hintTxt:roleTxt(a)[0]+'...'}}
function qSport(sc){const n=sc.sports.length;return {type:'sport',part:1,prompt:n>1?'Can you name three sports you can see?':'What sport can you see?',sports:sc.sports,need:Math.min(n,3),model:n>1?`I can see ${sc.sports.slice(0,-1).join(', ')} and ${sc.sports[n-1]}.`:`I can see ${sc.sports[0]}.`}}
function qSentence(){return {type:'sentence',part:3,prompt:'Write a sentence about the picture.',model:''}}
function qDescribe(){return {type:'describe',part:3,prompt:'Describe the picture. Use -ing words!',model:''}}

function buildRound(sc,mode){
  const A=shuffle(sc.actors),P=i=>A[i%A.length],items=shuffle(sc.items);
  if(mode==='write') return [qVerb(sc,P(0)),qWhere(sc,P(1)),qWhich(items[0]),qSpell(items[1]||items[0],mode),qBlanks(sc,P(2)),qSentence()];
  const uniq=sc.actors.filter(a=>sc.actors.filter(b=>b.verb===a.verb).length===1);
  const q5=sc.sports.length?qSport(sc):qWho(sc,rnd(uniq.length?uniq:sc.actors));
  return [qVerb(sc,P(0)),qWhere(sc,P(1)),qWhich(items[0]),qSpell(items[1]||items[0],mode),q5,qDescribe()];
}

function bindQ(q){
  const ans=$('#ans');
  if(ans&&q.type!=='sentence'){ans.focus({preventScroll:true});ans.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#checkBtn')?.click()}})}

  if(q.type==='which') screen.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pickChoice(q,b));
  if(q.type==='sentence'){const upd=()=>{const r=analyze(ans.value);$('#prev').innerHTML=r.html||'<span class="note">Your colored sentence appears here.</span>';
      screen.querySelectorAll('#chk li').forEach(li=>li.classList.toggle('on',r.found[li.dataset.k]>0))};ans.addEventListener('input',upd);upd();ans.focus({preventScroll:true})}

  const ad=$('#adultDescribe');

function micPress(q,btn){

/* ---- grading ---- */
function gradeText(q,texts,spoken){
  const almostPts=spoken?7:5;let best={pts:0,msg:'Look at the picture again.'};
  for(const t of texts){let r;
    if(q.type==='verb'){const m=matchForms(t,q.forms);
      if(m.res==='ok')r={pts:10,msg:'You used the -ing word!'};
      else if(m.res==='almost')r={pts:almostPts,msg:spoken?`Close! Say it clearly: ${m.form}`:`Check the spelling: ${m.cand} → ${m.form}`};
      else{const b=q.forms.map(f=>BASE[f]).filter(Boolean);r=b.some(x=>(' '+norm(t)+' ').includes(' '+x+' '))?{pts:3,msg:'Remember to add -ing!'}:{pts:0,msg:'Look at what they are doing.'}}}
    else if(q.type==='where'){const m=matchForms(t,q.forms);const hasPrep=(' '+norm(t)+' ').includes(' '+q.prep+' ');
      if(m.res==='ok')r=hasPrep?{pts:10,msg:'Perfect place!'}:{pts:8,msg:`Good! Add the preposition: ${q.prep} the ${m.form}`};
      else if(m.res==='almost')r={pts:almostPts,msg:spoken?`Close! Say: ${q.prep} the ${m.form}`:`Check the spelling: ${m.cand} → ${m.form}`};
      else r={pts:0,msg:'Where are they? Look at the ground.'}}
    else if(q.type==='spell'||q.type==='say'||q.type==='who'){const m=matchForms(t,q.forms);
      r=m.res==='ok'?{pts:10,msg:'Great word!'}:m.res==='almost'?{pts:almostPts,msg:spoken?`Close! Say: ${m.form}`:`Check the spelling: ${m.cand} → ${m.form}`}:{pts:0,msg:'Try again!'}}
    else if(q.type==='sport'){let n=0;q.sports.forEach(s=>{if(matchForms(t,[s]).res!=='no')n++});
      r={pts:Math.round(10*Math.min(n,q.need)/q.need),msg:n>=q.need?'You found them!':`You named ${n}. Look again!`}}
    if(r.pts>best.pts||!best.set){best={...r,set:true}}
  }
  return best;
}
const MISSING={pc:'Use is or are + an -ing word (is kicking).',mem:'Add a sport member (coach, runner, fans...).',place:'Add a place (field, court, track...).',prep:'Add a preposition (on, into, over, through, across, around).',vocab:'Add a vocabulary word (ball, net, hoop...).'};
function gradeSentence(text,spoken){
  const r=analyze(text);const pts=r.count*2;const miss=Object.keys(MISSING).filter(k=>!r.found[k]);
  let msg=miss.length?MISSING[miss[0]]:'All five colors! Excellent!';
  if(!r.found.pc&&r.loose)msg='Add is or are before the -ing word.';
  const tips=[];
  if(!spoken){if(!/^[A-Z]/.test(text.trim()))tips.push('Start with a capital letter.');if(!/\.\s*$/.test(text))tips.push('End with a period.')}
  if(r.found.mem&&(r.found.pc||r.loose))tips.push(pictureMatch(r.words,G.scene)?'That is in the picture!':'Hmm, is that in the picture?');
  return {pts,msg,colored:r.html,tips};
}
function gradeBlanks(q){
  let sum=0,all=true;
  q.slots.forEach((s,i)=>{const el=$('#bl'+i);const m=matchForms(el.value,s.forms);const v=m.res==='ok'?1:m.res==='almost'?.5:0;sum+=v;if(v<1)all=false;
    el.classList.toggle('ok',v===1);el.classList.toggle('bad',v<1)});
  afterGrade(q,{pts:Math.round(10*sum/q.slots.length),msg:all?'Every blank is right!':'Fix the red blanks.'});
}
function pickChoice(q,b){
  if(q.done)return;q.tries++;
  if(b.dataset.w===q.word){b.classList.add('right');finish(q,{pts:q.tries===1?10:5,msg:'You found it!'})}
  else{b.classList.add('wrong');b.disabled=true;
    if(q.tries>=2){screen.querySelector(`.choice[data-w="${q.word}"]`).classList.add('right');finish(q,{pts:0,msg:`This one is the ${q.word}.`})}
    else showMsg('try','Try again!','That is not it. Look again.')}
}
function afterGrade(q,res){
  if(q.done)return;q.tries++;
  let pts=res.pts;if(q.tries>1)pts=Math.min(pts,8);if(q.hint)pts=Math.max(0,pts-2);
  q.best=Math.max(q.best||0,pts);
  if(res.pts>=10||q.tries>=2) return finish(q,{...res,pts:q.best});
  showMsg(res.pts>=5?'almost':'try',res.pts>=5?'Almost!':'Not yet',esc(res.msg)+(res.colored?`<div class="model">${res.colored}</div>`:'')+(res.tips&&res.tips.length?`<div class="note">${res.tips.map(esc).join(' ')}</div>`:''),
    `<button class="btn" id="showAns">Show answer</button><button class="btn btn-primary" id="retry">Try again</button>`);
  $('#retry').onclick=()=>{$('#fb').innerHTML='';const a=$('#ans');if(a){a.focus();a.select?.()}else if($('#micBtn')){$('#heard').textContent='Tap the microphone and try again.'}else{const f=screen.querySelector('.blank.bad');f&&f.focus()}};
  $('#showAns').onclick=()=>finish(q,{...res,pts:q.best});
}
function modelHTML(q){
  if(q.type==='sentence'||q.type==='describe'){const ex=shuffle(G.scene.actors).slice(0,q.type==='describe'?3:1).map(modelSentence).join(' ');return analyze(ex).html}
  return analyze(q.model).html;
}
function showMsg(kind,title,html,buttons=''){
  $('#fb').innerHTML=`<div class="fb ${kind}"><div class="verdict">${title}</div><div>${html}</div>${buttons?`<div class="actions">${buttons}</div>`:''}</div>`;
}
function finish(q,res){
  if(q.done)return;q.done=true;stopListening();
  const pts=Math.max(0,Math.min(10,res.pts));q.pts=pts;G.score+=pts;
  setLeds('game');if(pts>0)popLed('#led1');
  const kind=pts>=10?'great':pts>=5?'almost':'try';
  const title=pts>=10?rnd(['Great job!','Super!','Goal!','Awesome!']):pts>=5?'Good try!':'Keep practicing!';
  const modelLbl=(q.type==='sentence'||q.type==='describe')?'Example from the picture:':'Answer:';
  const answerKey=(q.type==='which'||q.type==='spell'||q.type==='say')?`<b style="font-size:1.4rem">${q.word}</b> · `:'';
  const modelText=(q.type==='sentence'||q.type==='describe')?null:q.model;
  showMsg(kind,`${title} <span class="pts">+${pts}</span>`,
    `${esc(res.msg||'')}${res.colored?`<div class="model">${res.colored}</div>`:''}${res.tips&&res.tips.length?`<div class="note">${res.tips.map(esc).join(' ')}</div>`:''}
     <div class="note" style="margin-top:6px">${modelLbl}</div><div class="model">${answerKey}${modelHTML(q)}</div>`,
    `<button class="btn" id="listenM">${SPEAKER} Listen</button><button class="btn btn-primary" id="nextBtn">${G.i+1<G.qs.length?'Next':'See my stars'}</button>`);
  const modelSpoken=$('#fb .model:last-of-type')?.textContent||modelText||'';
  $('#listenM').onclick=()=>say(modelSpoken.replace(/·/g,'.'));
  $('#nextBtn').onclick=()=>{G.i++;if(G.i>=G.qs.length)renderResults();else renderGame()};
  $('#nextBtn').focus({preventScroll:true});
  screen.querySelectorAll('#qp input, #qp textarea, #checkBtn, #hintBtn, #micBtn, #revealBtn').forEach(el=>el.disabled=true);
  if(pts>=10)burst(40);
}

/* ---- results & prizes ---- */

  const sc=G.scene,mode=G.mode,max=G.qs.length*10,pct=G.score/max;
  const stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  const before=stickersOwned(),prevBest=PR.best[mode][sc.id]||0;
  PR.best[mode][sc.id]=Math.max(prevBest,stars);PR.points+=G.score;save();
  const after=stickersOwned(),fresh=STICKERS.slice(before,after);
  setLeds('home');popLed('#led2');
  const title=stars===3?'Champion!':stars===2?'Great game!':stars===1?'Good game!':'Keep training!';
  const nextSc=SCENES[(SCENES.indexOf(sc)+1)%SCENES.length];
  screen.innerHTML=`<section class="card results">
    <div class="bigstars" aria-label="${stars} of 3 stars">${Array.from({length:3},(_,i)=>`<span class="${i<stars?'':'off'}">★</span>`).join('')}</div>
    <h2>${title}</h2>
    <p style="margin:0">${esc(sc.name)} · ${mode==='write'?'Writing':'Speaking'} · <b>${G.score}</b> of ${max} points</p>
    ${stars>prevBest&&prevBest>0?'<p class="note">New best for this place!</p>':''}
    ${fresh.length?`<div><p style="margin:0 0 8px;font-weight:700">New sticker${fresh.length>1?'s':''}!</p><div class="newsticker">${fresh.map(([k,w],i)=>`<div class="sticker got" style="--r:${i%2?3:-3}deg;width:130px">${icon(k,w)}<b>${w}</b></div>`).join('')}</div></div>`:
      `<p class="note">${after<16?`${3-totalStars()%3} more star${3-totalStars()%3===1?'':'s'} to open the next sticker.`:'You have every sticker!'}</p>`}
    <div class="row" style="justify-content:center">
      <button class="btn" id="homeB">Home</button><button class="btn" id="againB">Play again</button><button class="btn btn-primary" id="nextB">Next: ${esc(nextSc.name)}</button></div></section>`;
  $('#homeB').onclick=renderHome;$('#againB').onclick=()=>startRound(sc.id);$('#nextB').onclick=()=>startRound(nextSc.id);
  burst(stars>=2?160:70);window.scrollTo(0,0);
}
function renderAlbum(){
  setLeds('home');const own=stickersOwned(),ts=totalStars();
  screen.innerHTML=`<section class="card" style="padding:18px;display:flex;flex-direction:column;gap:14px">
    <div class="row" style="justify-content:space-between"><h2 class="sec-title">Sticker album · ${own}/16</h2><button class="btn btn-sm" id="backB">Back</button></div>
    <p class="note">Every 3 stars opens a sticker. You have ${ts} stars. Say the word of each sticker out loud!</p>
    <div class="album">${STICKERS.map(([k,w],i)=>i<own?`<div class="sticker got" style="--r:${(i%3-1)*3}deg">${icon(k,w)}<b>${w}</b><button class="btn btn-sm" data-say="${w}">${SPEAKER}</button></div>`:`<div class="sticker locked">${icon(k,'locked sticker')}<b>?</b><small>${(i+1)*3} stars</small></div>`).join('')}</div></section>`;
  $('#backB').onclick=renderHome;
  screen.querySelectorAll('[data-say]').forEach(b=>{b.setAttribute('aria-label','Listen to '+b.dataset.say);b.onclick=()=>say(b.dataset.say)});
}

/* ---- confetti ---- */
function burst(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d');cv.hidden=false;cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#F26A1B','#FFB627','#2F6FE0','#2FA35B','#E85A9A','#14306E'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*360,c:rnd(cols),s:6+Math.random()*6}));
  let t=0;(function f(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=8;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(++t<110)requestAnimationFrame(f);else{ctx.clearRect(0,0,cv.width,cv.height);cv.hidden=true}})();
}

$('#homeBtn').onclick=renderHome;
renderHome();
</script>
